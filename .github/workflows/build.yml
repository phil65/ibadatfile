name: Build

on: [push, pull_request]

env:
  FORCE_COLOR: 1
  RUFF_OUTPUT_FORMAT: github

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 3.15 is a pre-release: test it early, but don't let it block the build.
    continue-on-error: ${{ matrix.python_version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.13", "3.14", "3.15"]
        os: ["windows-latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies (uv sync)
        run: uv sync --all-extras --no-group docs

      # ruff / ty come from the pinned `lint` group, same versions as pre-commit.
      - name: Check for code issues (ruff check)
        run: uv run --no-group docs ruff check .

      - name: Check code format (ruff format)
        run: uv run --no-group docs ruff format --check .

      - name: Static type checking (ty)
        run: uv run --no-group docs ty check

      - name: Run tests
        run: uv run --no-group docs pytest --cov-report=xml --cov=src/ibadatfile/ --cov-report=term-missing

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          verbose: true

  release:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Release package on GitHub
        uses: ncipollo/release-action@v1
        with:
          body: ${{ github.event.head_commit.message }}
          artifacts: dist/*.whl,dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
